<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping list</title>  
    <link rel="stylesheet" href="style.css">      
</head>
<body>
    <h1> Interactive Shopping list</h1>
    <div class="list">
        <form>
            <input type="text" placeholder="goods" id = "product" required > 
            <input type="number" placeholder="price" id = "price" required >
            <button type="submit">+</button>
        </form>
    </div>

    
    <section class="container"></section>
    <section class="btn-sections hidden">
        <button class="clear-list">Clear list</button>
    
    </section>
    
</body>
<script src="index.js"></script>
</html>
